[package]
name = "noko-note"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "flac", "ogg", "vorbis", "alac"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4"] }

# Metal GPU 가속은 Mac에서만 켠다. Windows·Linux는 CPU로 받아쓴다.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[workspace]
members = ["src-tauri"]
