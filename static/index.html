<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noko-Note</title>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --line: #e4e1da; --text: #1f1d1a; --muted: #6f6a61;
  --accent: #c2603a; --accent-soft: #f6e6de; --ok: #2f7d4f; --ok-soft: #e1f1e7;
  --warn: #9a6a00; --warn-soft: #fbf0d4; --err: #b3342b; --err-soft: #f9e1df;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05);
  color-scheme: light;
}
/* data-theme: system(기본, OS 설정을 따름) · light · dark */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --panel: #201f1c; --line: #34322d; --text: #ece9e3; --muted: #a39d92;
    --accent: #e0825c; --accent-soft: #3a2a22; --ok: #6cc893; --ok-soft: #1e3327;
    --warn: #e2b54a; --warn-soft: #362d17; --err: #ef7d73; --err-soft: #3b2120;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --panel: #201f1c; --line: #34322d; --text: #ece9e3; --muted: #a39d92;
  --accent: #e0825c; --accent-soft: #3a2a22; --ok: #6cc893; --ok-soft: #1e3327;
  --warn: #e2b54a; --warn-soft: #362d17; --err: #ef7d73; --err-soft: #3b2120;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
header h1 span { color: var(--accent); }
.pills { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--line); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--err-soft); color: var(--err); }
.layout { display: grid; grid-template-columns: 220px 340px 1fr; height: calc(100vh - 55px); }
aside, .list, .detail { overflow-y: auto; padding: 16px; }
aside { border-right: 1px solid var(--line); }
.list { border-right: 1px solid var(--line); }
.section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.channel { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px;
  border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
.channel:hover { background: var(--line); }
.channel.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.channel small { display: block; color: var(--muted); font-weight: 400; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px;
  cursor: pointer; font-size: 14px; white-space: nowrap; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--err); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input[type=text], input[type=url], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); }
textarea { resize: vertical; min-height: 70px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px; text-align: center;
  color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { color: var(--text); }
.rec { cursor: pointer; }
.rec:hover { border-color: var(--muted); }
.rec.active { border-color: var(--accent); }
.rec-title { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 12.5px; color: var(--muted); }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.badge.error { background: var(--err-soft); color: var(--err); }
.badge.busy { background: var(--warn-soft); color: var(--warn); }
.bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 12px 0 0; }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--text); border-color: var(--accent); font-weight: 600; }
.doc { padding: 4px 2px; max-width: 820px; }
.doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; margin-top: 1.4em; } .doc h3 { font-size: 16px; }
.doc table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
.doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.doc blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.doc code { background: var(--line); padding: 1px 5px; border-radius: 4px; }
.transcript { white-space: pre-wrap; font-size: 14px; max-width: 820px; }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }
.error-box { background: var(--err-soft); color: var(--err); padding: 10px 12px; border-radius: 8px;
  margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; min-height: 40px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: text; }
.tags:focus-within { border-color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.tag button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 4px; font-size: 14px; line-height: 1; }
.tags input { flex: 1; min-width: 120px; border: 0; outline: 0; background: none; padding: 2px; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
details summary { cursor: pointer; font-weight: 600; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
  color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .3s;
  pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside, .list { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>Noko<span>-</span>Note</h1>
  <div class="pills">
    <span id="whisperPill" class="pill">Whisper 확인 중</span>
    <span id="claudePill" class="pill">Claude 확인 중</span>
    <button id="loginBtn" class="btn small" hidden>Claude 계정 연결</button>
    <button id="themeBtn" class="btn small" type="button"></button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="section-title">채널 <button class="btn small" id="newChannelBtn">+ 새 채널</button></div>
    <div id="channels"></div>
  </aside>

  <section class="list">
    <div id="whisperPanel"></div>
    <div id="channelPanel"></div>
    <div class="section-title" style="margin-top:16px">녹음</div>
    <div id="recordings"></div>
  </section>

  <main class="detail" id="detail">
    <div class="empty">왼쪽에서 녹음을 고르면 요약이 여기에 보입니다.</div>
  </main>
</div>
<div id="toast"></div>

<script>
const state = { channels: [], channelId: null, recordings: [], recId: null, rec: null, tab: 'summary' };
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BUSY = ['queued', 'transcribing', 'summarizing'];
const STATUS_LABEL = { queued: '대기 중', transcribing: '받아쓰는 중', summarizing: '요약 중', done: '완료', error: '오류' };

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
  return data;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 3000);
}
// 데스크톱 앱(Tauri) 안에서 실행 중이면 저장 대화상자·파일 위치 열기를 쓴다.
const desktop = window.__TAURI__?.core;
function renderMarkdown(md) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
  return `<pre class="transcript">${esc(md)}</pre>`;
}
function fmtDuration(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m ? `${m}분 ${s}초` : `${s}초`;
}

// ---- Whisper 모델 ----
let statusTimer = null;
function renderWhisper(st) {
  const w = st.whisper, wp = $('#whisperPill'), panel = $('#whisperPanel');
  const busy = w.state === 'loading' || w.state === 'downloading';
  const label = { ready: 'Whisper 준비됨', loading: 'Whisper 불러오는 중', downloading: 'Whisper 내려받는 중',
    missing: 'Whisper 모델 없음', failed: 'Whisper 오류' }[w.state];
  wp.textContent = label; wp.className = 'pill ' + (w.state === 'ready' ? 'ok' : busy ? '' : 'err');
  // 준비 중이면 2초마다 상태를 다시 확인한다.
  clearTimeout(statusTimer);
  if (busy) statusTimer = setTimeout(loadStatus, 2000);

  if (w.state === 'ready' || w.state === 'loading') { panel.innerHTML = ''; return; }
  if (w.state === 'downloading') {
    const pct = w.total ? Math.floor(w.downloaded / w.total * 100) : 0;
    const mb = (n) => (n / 1048576).toFixed(0);
    panel.innerHTML = `<div class="card"><strong>Whisper 모델 내려받는 중</strong>
      <div class="meta">${esc(w.model)} · ${mb(w.downloaded)} / ${w.total ? mb(w.total) : '?'} MB (${pct}%)</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="hint">창을 닫지 마세요. 끝나면 바로 받아쓰기를 쓸 수 있습니다.</div></div>`;
    return;
  }
  const isWin = navigator.userAgent.includes('Windows');
  const choices = st.models.map((m, i) => `
    <label style="display:flex;gap:8px;align-items:flex-start;color:var(--text);margin:6px 0">
      <input type="radio" name="model" value="${m.key}" ${(isWin ? i === 1 : i === 0) ? 'checked' : ''}>
      <span>${esc(m.label)}<br><span class="meta">${esc(m.key)} · 약 ${m.size_mb >= 1000 ? (m.size_mb / 1000).toFixed(1) + 'GB' : m.size_mb + 'MB'}</span></span>
    </label>`).join('');
  panel.innerHTML = `<div class="card"><strong>받아쓰기에 쓸 Whisper 모델이 필요합니다</strong>
    <div class="hint">한 번만 내려받으면 인터넷 없이 이 컴퓨터에서 받아쓰기합니다.</div>
    ${w.state === 'failed' ? `<div class="error-box">${esc(w.error)}</div>` : ''}
    ${choices}
    <div class="row"><button class="btn primary" id="dlBtn">모델 내려받기</button></div></div>`;
  $('#dlBtn').onclick = async () => {
    const model = document.querySelector('input[name=model]:checked').value;
    try { await api('/api/whisper/download', { method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ model }) }); await loadStatus(); } catch (e) { toast(e.message); }
  };
}

// ---- 상태 ----
async function loadStatus() {
  try {
    const st = await api('/api/status');
    renderWhisper(st);
    const cp = $('#claudePill'), c = st.claude;
    if (!c.installed) { cp.textContent = 'Claude CLI 없음'; cp.className = 'pill err'; }
    else if (c.logged_in) {
      cp.textContent = `Claude 연결됨 · ${c.email || ''}${c.subscription ? ' (' + c.subscription + ')' : ''}`;
      cp.className = 'pill ok';
    } else { cp.textContent = 'Claude 계정 연결 필요'; cp.className = 'pill err'; }
    $('#loginBtn').hidden = !c.installed || c.logged_in;
  } catch (e) { console.error(e); }
}
$('#loginBtn').onclick = async () => {
  try {
    await api('/api/claude/login', { method: 'POST' });
    toast('브라우저에서 claude.ai 로그인 페이지가 열립니다. 로그인을 마치면 자동으로 연결됩니다.');
    let n = 0; const timer = setInterval// ---- 화면 테마 ----
const THEMES = { system: '🖥 시스템', light: '☀️ 라이트', dark: '🌙 다크' };
const NEXT_THEME = { system: 'light', light: 'dark', dark: 'system' };
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#themeBtn').textContent = THEMES[theme];
  $('#themeBtn').title = `화면 테마: ${THEMES[theme]} (눌러서 바꾸기)`;
  desktop?.invoke('set_window_theme', { theme }).catch(() => {});
}
$('#themeBtn').onclick = async () => {
  const theme = NEXT_THEME[document.documentElement.dataset.theme] || 'system';
  applyTheme(theme);
  try { await api('/api/settings/theme', { method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ theme }) }); } catch (e) { toast(e.message); }
};
applyTheme(THEMES[document.documentElement.dataset.theme] ? document.documentElement.dataset.theme : 'system');

(async () => { await loadStatus(); if (++n > 60 || $('#loginBtn').hidden) clearInterval(timer); }, 3000);
  } catch (e) { toast(e.message); }
};

// ---- 채널 ----
async function loadChannels() {
  state.channels = await api('/api/channels');
  if (!state.channels.find(c => c.id === state.channelId)) state.channelId = state.channels[0]?.id ?? null;
  renderChannels(); renderChannelPanel();
}
function renderChannels() {
  $('#channels').innerHTML = state.channels.map(c => `
    <button class="channel ${c.id === state.channelId ? 'active' : ''}" data-id="${c.id}">
      # ${esc(c.name)}<small>${esc(c.concept || '기본 요약')}</small>
    </button>`).join('');
  document.querySelectorAll('.channel').forEach(b => b.onclick = () => selectChannel(+b.dataset.id));
}
async function selectChannel(id) {
  state.channelId = id; state.recId = null; state.rec = null;
  renderChannels(); renderChannelPanel(); renderDetail();
  await loadRecordings();
}
function renderChannelPanel() {
  const c = state.channels.find(c => c.id === state.channelId);
  if (!c) { $('#channelPanel').innerHTML = '<div class="empty">채널을 만들어 주세요.</div>'; return; }
  $('#channelPanel').innerHTML = `
    <div class="card">
      <details>
        <summary># ${esc(c.name)} 설정</summary>
        <label>채널 이름</label><input type="text" id="chName" value="${esc(c.name)}">
        <label>요약 컨셉 (이 방에 올리는 녹음은 이 기준으로 요약합니다)</label>
        <textarea id="chConcept" rows="5" placeholder="예: 주간 회의록. 결정 사항과 담당자별 할 일을 표로 정리.">${esc(c.concept)}</textarea>
        <label>등장인물 (자주 나오는 사람 이름)</label>
        <div class="tags" id="chPeople"><input type="text" id="chPeopleInput" placeholder="이름 입력 후 Enter"></div>
        <div class="hint">받아쓰기와 요약에서 이름을 이 표기대로 맞춥니다. 쉼표로 여러 명을 한 번에 넣을 수 있습니다.</div>
        <label>Slack Incoming Webhook (선택)</label>
        <input type="url" id="chSlack" value="${esc(c.slack_webhook)}" placeholder="https://hooks.slack.com/services/...">
        <label>Discord Webhook (선택)</label>
        <input type="url" id="chDiscord" value="${esc(c.discord_webhook)}" placeholder="https://discord.com/api/webhooks/...">
        <div class="row">
          <button class="btn primary" id="chSave">저장</button>
          <button class="btn danger" id="chDelete">채널 삭제</button>
        </div>
      </details>
    </div>
    <div class="card">
      <div class="drop" id="drop"><strong>음성 파일을 끌어다 놓거나 눌러서 선택</strong><br>
        <span class="meta">m4a, mp3, wav 등</span><div id="pickedName" class="meta"></div></div>
      <input type="file" id="fileInput" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.caf" hidden>
      <label>제목 (비우면 파일 이름)</label><input type="text" id="upTitle">
      <label>이번 녹음에만 줄 추가 요청 (선택)</label>
      <textarea id="upInstruction" rows="2" placeholder="예: 예산 이야기 위주로 정리해줘"></textarea>
      <div class="row"><button class="btn primary" id="upBtn" disabled>올리고 요약하기</button>
        <span class="meta" id="upProgress"></span></div>
    </div>`;
  $('#chSave').onclick = saveChannel;
  $('#chDelete').onclick = deleteChannel;
  setupPeople(c.participants || []);
  setupUpload();
}
// ---- 등장인물 태그 ----
let people = [];
function setupPeople(initial) {
  people = [...initial];
  const box = $('#chPeople'), input = $('#chPeopleInput');
  const render = () => {
    box.querySelectorAll('.tag').forEach(t => t.remove());
    people.forEach((name, i) => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = `${esc(name)}<button type="button" title="빼기" aria-label="${esc(name)} 빼기">×</button>`;
      tag.querySelector('button').onclick = () => { people.splice(i, 1); render(); };
      box.insertBefore(tag, input);
    });
  };
  const commit = () => {
    for (const raw of input.value.split(/[,，、\n]/)) {
      const name = raw.trim().replace(/\s+/g, ' ');
      if (name && !people.some(p => p.toLowerCase() === name.toLowerCase())) people.push(name);
    }
    input.value = ''; render();
  };
  input.onkeydown = e => {
    if (e.isComposing) return; // 한글 조합 중 Enter는 무시
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); }
    else if (e.key === 'Backspace' && !input.value && people.length) { people.pop(); render(); }
  };
  input.onblur = commit;
  input.onpaste = () => setTimeout(commit);
  box.onclick = e => { if (e.target === box) input.focus(); };
  render();
}
function channelForm() {
  if ($('#chPeopleInput').value.trim()) $('#chPeopleInput').onblur();
  return { name: $('#chName').value, concept: $('#chConcept').value, participants: people,
    slack_webhook: $('#chSlack').value, discord_webhook: $('#chDiscord').value };
}
async function saveChannel() {
  try { await api(`/api/channels/${state.channelId}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(channelForm()) });
    toast('채널 설정을 저장했습니다'); await loadChannels(); } catch (e) { toast(e.message); }
}
async function deleteChannel() {
  const c = state.channels.find(c => c.id === state.channelId);
  if (!confirm(`'${c.name}' 채널과 그 안의 녹음을 모두 삭제할까요? (저장된 md 파일은 남습니다)`)) return;
  try { await api(`/api/channels/${state.channelId}`, { method: 'DELETE' }); state.channelId = null;
    await loadChannels(); await loadRecordings(); renderDetail(); } catch (e) { toast(e.message); }
}
$('#newChannelBtn').onclick = async () => {
  const name = prompt('새 채널 이름'); if (!name) return;
  try { const c = await api('/api/channels', { method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name }) });
    state.channelId = c.id; await loadChannels(); await loadRecordings();
    document.querySelector('#channelPanel details').open = true; $('#chConcept').focus();
  } catch (e) { toast(e.message); }
};

// ---- 업로드 ----
let pickedFile = null;
function setupUpload() {
  pickedFile = null;
  const drop = $('#drop'), input = $('#fileInput');
  const pick = (f) => { pickedFile = f; $('#pickedName').textContent = f ? f.name : ''; $('#upBtn').disabled = !f; };
  drop.onclick = () => input.click();
  input.onchange = () => pick(input.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };
  $('#upBtn').onclick = upload;
}
function upload() {
  if (!pickedFile) return;
  const fd = new FormData();
  fd.append('title', $('#upTitle').value);
  fd.append('instruction', $('#upInstruction').value);
  fd.append('file', pickedFile);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `/api/channels/${state.channelId}/recordings`);
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) $('#upProgress').textContent = `업로드 ${Math.round(e.loaded / e.total * 100)}%`; };
  xhr.onload = async () => {
    $('#upBtn').disabled = false;
    const data = JSON.parse(xhr.responseText || '{}');
    if (xhr.status >= 400) { $('#upProgress').textContent = ''; toast(data.error || '업로드 실패'); return; }
    $('#upProgress').textContent = ''; renderChannelPanel(); toast('업로드했습니다. 받아쓰기를 시작합니다.');
    await loadRecordings(); selectRecording(data.id);
  };
  xhr.onerror = () => { $('#upBtn').disabled = false; toast('업로드 중 연결이 끊겼습니다'); };
  $('#upBtn').disabled = true;
  xhr.send(fd);
}

// ---- 녹음 목록 ----
async function loadRecordings() {
  if (!state.channelId) { state.recordings = []; renderRecordings(); return; }
  state.recordings = await api(`/api/channels/${state.channelId}/recordings`);
  renderRecordings();
}
function badge(r) {
  const cls = r.status === 'done' ? 'done' : r.status === 'error' ? 'error' : 'busy';
  let label = STATUS_LABEL[r.status];
  if (r.status === 'transcribing') label += ` ${r.progress}%`;
  return `<span class="badge ${cls}">${label}</span>`;
}
function renderRecordings() {
  if (!state.recordings.length) { $('#recordings').innerHTML = '<div class="empty">아직 녹음이 없습니다.</div>'; return; }
  $('#recordings').innerHTML = state.recordings.map(r => `
    <div class="card rec ${r.id === state.recId ? 'active' : ''}" data-id="${r.id}">
      <div class="row" style="margin:0;justify-content:space-between"><span class="rec-title">${esc(r.title)}</span>${badge(r)}</div>
      <div class="meta">${esc(r.created_at)}${r.duration_sec ? ' · ' + fmtDuration(r.duration_sec) : ''}</div>
      ${r.status === 'transcribing' ? `<div class="bar"><i style="width:${r.progress}%"></i></div>` : ''}
    </div>`).join('');
  document.querySelectorAll('.rec').forEach(el => el.onclick = () => selectRecording(+el.dataset.id));
}

// ---- 상세 ----
async function selectRecording(id) {
  state.recId = id; renderRecordings();
  state.rec = await api(`/api/recordings/${id}`);
  if (!state.rec.summary) state.tab = state.rec.transcript ? 'transcript' : 'summary';
  else state.tab = 'summary';
  renderDetail();
}
function renderDetail() {
  const r = state.rec;
  if (!r) { $('#detail').innerHTML = '<div class="empty">왼쪽에서 녹음을 고르면 요약이 여기에 보입니다.</div>'; return; }
  const ch = state.channels.find(c => c.id === r.channel_id) || {};
  const busy = BUSY.includes(r.status);
  let body;
  if (state.tab === 'summary') {
    if (r.summary) body = `<div class="doc">${renderMarkdown(r.summary)}</div>`;
    else if (r.status === 'error') body = '<div class="empty">요약을 만들지 못했습니다.</div>';
    else body = `<div class="empty">${STATUS_LABEL[r.status]}… ${r.status === 'transcribing' ? r.progress + '%' : ''}<br>
      <span class="meta">끝나면 이 화면에 자동으로 나타납니다.</span></div>`;
  } else {
    body = r.transcript ? `<div class="transcript">${esc(r.transcript)}</div>` : '<div class="empty">받아쓰기가 아직 끝나지 않았습니다.</div>';
  }
  $('#detail').innerHTML = `
    <div class="row" style="margin:0;justify-content:space-between">
      <h2 style="margin:0;font-size:20px;overflow-wrap:anywhere">${esc(r.title)}</h2>${badge(r)}
    </div>
    <div class="meta"># ${esc(ch.name)} · ${esc(r.created_at)}${r.duration_sec ? ' · ' + fmtDuration(r.duration_sec) : ''}
      ${r.summary_path ? `<br>저장 위치: ${esc(r.summary_path)}` : ''}</div>
    ${r.error ? `<div class="error-box">${esc(r.error)}</div>` : ''}
    <div class="row">
      ${desktop
        ? `<button class="btn" data-save ${r.summary ? '' : 'disabled'}>md로 저장…</button>
           <button class="btn" data-reveal ${r.summary_path ? '' : 'disabled'}>${navigator.userAgent.includes('Windows') ? '탐색기에서 보기' : 'Finder에서 보기'}</button>`
        : `<a class="btn" href="/api/recordings/${r.id}/summary.md" ${r.summary ? '' : 'style="pointer-events:none;opacity:.5"'}>md 다운로드</a>`}
      <button class="btn" data-copy ${r.summary ? '' : 'disabled'}>요약 복사</button>
      <button class="btn" data-send="slack" ${r.summary && ch.slack_webhook ? '' : 'disabled'} title="${ch.slack_webhook ? '' : '채널 설정에서 Slack 웹훅을 넣으세요'}">Slack 보내기</button>
      <button class="btn" data-send="discord" ${r.summary && ch.discord_webhook ? '' : 'disabled'} title="${ch.discord_webhook ? '' : '채널 설정에서 Discord 웹훅을 넣으세요'}">Discord 보내기</button>
      <button class="btn danger" data-del>삭제</button>
    </div>
    <div class="card" style="margin-top:12px">
      <label style="margin-top:0">다른 컨셉으로 다시 요약 (채널 컨셉에 덧붙여 이번에만 적용)</label>
      <textarea id="reInstruction" rows="2" placeholder="예: 임원 보고용으로 5줄 이내로 요약해줘">${esc(r.instruction)}</textarea>
      <div class="row"><button class="btn primary" id="reBtn" ${busy || (!r.transcript && r.status !== 'error') ? 'disabled' : ''}>${r.transcript ? '다시 요약' : '받아쓰기부터 다시'}</button></div>
    </div>
    <div class="tabs">
      <button class="tab ${state.tab === 'summary' ? 'active' : ''}" data-tab="summary">요약</button>
      <button class="tab ${state.tab === 'transcript' ? 'active' : ''}" data-tab="transcript">녹취록</button>
    </div>
    <div style="padding-top:12px">${body}</div>`;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; renderDetail(); });
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => sendTo(b.dataset.send));
  $('[data-copy]').onclick = async () => { await navigator.clipboard.writeText(r.summary); toast('요약을 복사했습니다'); };
  $('[data-del]').onclick = deleteRecording;
  if (desktop) {
    $('[data-save]').onclick = async () => {
      try { const path = await desktop.invoke('save_markdown', { recordingId: r.id });
        if (path) toast(`저장했습니다: ${path}`); } catch (e) { toast(String(e)); }
    };
    $('[data-reveal]').onclick = () => desktop.invoke('reveal_summary', { recordingId: r.id }).catch(e => toast(String(e)));
  }
  $('#reBtn').onclick = resummarize;
}
async function sendTo(target) {
  const name = target === 'slack' ? 'Slack' : 'Discord';
  if (!confirm(`이 요약을 '${state.channels.find(c => c.id === state.rec.channel_id).name}' 채널에 설정된 ${name}로 보낼까요?`)) return;
  try { await api(`/api/recordings/${state.rec.id}/send`, { method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ target }) }); toast(`${name}로 보냈습니다`); } catch (e) { toast(e.message); }
}
async function resummarize() {
  try { state.rec = await api(`/api/recordings/${state.rec.id}/summarize`, { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ instruction: $('#reInstruction').value }) });
    renderDetail(); await loadRecordings(); toast('다시 요약하는 중입니다'); } catch (e) { toast(e.message); }
}
async function deleteRecording() {
  if (!confirm('이 녹음과 요약을 삭제할까요? (저장된 md 파일은 남습니다)')) return;
  try { await api(`/api/recordings/${state.rec.id}`, { method: 'DELETE' }); state.rec = null; state.recId = null;
    renderDetail(); await loadRecordings(); } catch (e) { toast(e.message); }
}

// 처리 중인 녹음이 있으면 2초마다 새로 고친다.
setInterval(async () => {
  if (!state.recordings.some(r => BUSY.includes(r.status))) return;
  await loadRecordings().catch(() => {});
  if (state.rec && BUSY.includes(state.rec.status)) {
    const fresh = await api(`/api/recordings/${state.rec.id}`).catch(() => null);
    if (fresh) {
      const finished = !BUSY.includes(fresh.status);
      state.rec = fresh;
      if (finished && fresh.summary) state.tab = 'summary';
      // 입력 중인 재요약 지시문을 덮어쓰지 않도록, 포커스가 없을 때만 다시 그린다.
      if (document.activeElement?.id !== 'reInstruction') renderDetail();
    }
  }
}, 2000);

// ---- 화면 테마 ----
const THEMES = { system: '🖥 시스템', light: '☀️ 라이트', dark: '🌙 다크' };
const NEXT_THEME = { system: 'light', light: 'dark', dark: 'system' };
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#themeBtn').textContent = THEMES[theme];
  $('#themeBtn').title = `화면 테마: ${THEMES[theme]} (눌러서 바꾸기)`;
  desktop?.invoke('set_window_theme', { theme }).catch(() => {});
}
$('#themeBtn').onclick = async () => {
  const theme = NEXT_THEME[document.documentElement.dataset.theme] || 'system';
  applyTheme(theme);
  try { await api('/api/settings/theme', { method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ theme }) }); } catch (e) { toast(e.message); }
};
applyTheme(THEMES[document.documentElement.dataset.theme] ? document.documentElement.dataset.theme : 'system');

(async () => { await loadStatus(); await loadChannels(); await loadRecordings(); })();
</script>
</body>
</html>
