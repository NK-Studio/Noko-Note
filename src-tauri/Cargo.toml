[package]
name = "noko-note-desktop"
version = "0.1.1"
edition = "2024"
description = "Noko-Note 데스크톱 앱 (Mac·Windows)"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
noko-note = { path = ".." }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
