# Noko-Note 데스크톱 앱(Tauri 2) 설치 파일을 Mac(Apple Silicon)·Windows에서 빌드한다.
# - 수동 실행(Actions 탭 → Run workflow): 빌드만 하고 결과물은 실행 화면의 Artifacts에 남긴다.
# - v* 태그 push(예: v0.1.0): 빌드한 뒤 GitHub Release를 만들고 설치 파일을 올린다.
#   태그 버전은 src-tauri/tauri.conf.json의 version과 같아야 한다.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# 같은 태그·브랜치에서 겹쳐 실행되면 앞의 것을 취소한다.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # whisper.cpp(whisper-rs-sys)는 CMake로 빌드하고, 바인딩 생성에 LLVM(libclang)을 쓴다.
      - name: Windows 빌드 도구 확인
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake --version

      - name: Tauri CLI 설치
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: 단위 테스트
        run: cargo test -p noko-note --release

      # 공증에 쓸 App Store Connect API 키(.p8)를 파일로 꺼낸다. Tauri는 키 경로(APPLE_API_KEY_PATH)를 받는다.
      - name: 공증용 API 키 준비
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Mac에서는 Tauri가 아래 환경 변수로 Developer ID 서명과 공증을 함께 한다(앱은 공증, dmg는 서명까지).
      # APPLE_API_KEY는 Tauri에서 키 ID를 뜻하므로 APPLE_API_KEY_ID 시크릿을 넘긴다.
      # Tauri는 CI(CI=true)에서 dmg 창 꾸미기(Finder AppleScript)를 건너뛰므로 TAURI_BUNDLER_DMG_IGNORE_CI로 켠다.
      # 그래야 tauri.conf.json의 배경(화살표·안내 문구)과 아이콘 자리가 dmg에 들어간다.
      - name: 데스크톱 앱 빌드
        working-directory: src-tauri
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || '' }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          KEYCHAIN_PASSWORD: ${{ runner.os == 'macOS' && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: 서명·공증 확인
        if: runner.os == 'macOS'
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Noko-Note.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vv -t exec "$app"
          xcrun stapler validate "$app"

      # 끌어다 놓아 설치하는 dmg(왼쪽 Noko-Note → 오른쪽 Applications)도 공증해 받은 그대로 열리게 한다.
      - name: dmg 공증
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          codesign --verify --strict --verbose=2 "$dmg"
          # 창 꾸미기가 들어갔는지(배경 그림·Finder 창 설정) 확인한다.
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          ls -la "$mnt" "$mnt/.background"
          test -f "$mnt/.background/background.tiff" && test -f "$mnt/.DS_Store"
          hdiutil detach "$mnt" -quiet
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

      - name: 공증용 API 키 지우기
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: Noko-Note-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 태그와 앱 버전 확인
        run: |
          app_version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 tauri.conf.json 버전(v$app_version)이 다릅니다"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 릴리스 만들고 설치 파일 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 아티팩트가 dmg/msi/nsis 하위 폴더로 내려오므로 파일만 한 폴더에 모은다
          mkdir -p files
          find dist -type f -exec mv {} files/ \;
          ls -la files
          cat > notes.md <<'NOTES'
          ## 내려받기

          | 운영체제 | 파일 |
          |---|---|
          | Mac (Apple Silicon: M1 이상, Intel Mac은 지원 안 함) | `Noko-Note_*_aarch64.dmg` |
          | Windows | `Noko-Note_*_x64-setup.exe` (권장) 또는 `*.msi` |

          ### Mac에서 처음 열 때
          Apple Developer ID로 서명·공증된 앱입니다. dmg를 열고 창 안의 `Noko-Note`를 옆의 `Applications` 폴더로 끌어다 놓으면 설치됩니다.

          ### Windows에서 처음 열 때
          SmartScreen 경고가 나오면 **추가 정보 → 실행**을 누르세요.

          ### 필요한 것
          - 요약: [Claude Code](https://claude.com/claude-code) 설치 후 앱 안에서 claude.ai 계정 연결
          - 받아쓰기: 앱 위쪽의 **모델 내려받기**로 Whisper 모델 설치
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/* \
              --title "Noko-Note $GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag
          fi
